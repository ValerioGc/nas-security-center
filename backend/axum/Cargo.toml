[package]
name = "nas-security-center-axum"
version = "0.9.1"
edition = "2021"
autotests = false

[dependencies]
axum = "0.8.9"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["fs", "macros", "net", "rt-multi-thread", "signal"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["io-util", "sync", "time"] }
